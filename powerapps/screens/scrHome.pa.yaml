# scrHome — COPIED BACK OUT OF STUDIO after a successful paste, 2 Sep 2026.
# This is Studio's own normalisation: properties alphabetised, comments stripped.
# The repo is downstream of Studio. Do not hand-edit and expect it to load —
# edit, paste into Studio, then copy back out over this file.
#
# Extraction route: Studio -> screen ... -> View code -> Copy code, then `pbpaste`
# in a shell. The Code dialog cannot be scrolled or scripted, but the clipboard works.
Screens:
  scrHome:
    Properties:
      Fill: =clrCanvas
      LoadingSpinnerColor: =clrBrand
      OnVisible: |
        =Set(varPageTitle, "Home");
        ClearCollect(
            colAwaiting,
            SortByColumns(
                Filter(
                    Requests,
                    StatusRank < 70,
                    Or(CurrentlyWithEmail = varUserEmail, CurrentlyWithOICEmail = varUserEmail)
                ),
                "SubmittedOn",
                SortOrder.Ascending
            )
        );
        ClearCollect(
            colMine,
            SortByColumns(
                Filter(Requests, RequesterEmail = varUserEmail),
                "SubmittedOn",
                SortOrder.Descending
            )
        )
    Children:
      - recNavBg:
