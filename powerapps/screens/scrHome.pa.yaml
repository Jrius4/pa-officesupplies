            PressedFill: =Self.Fill
            RadiusBottomLeft: =rad6
            RadiusBottomRight: =rad6
            RadiusTopLeft: =rad6
            RadiusTopRight: =rad6
            Text: =""
            Width: =dimBrandMark
            X: =spc12
            Y: =spc14
