<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 513.2" width="878" height="513.2"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8886"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="28" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#323130" font-weight="700" text-anchor="start">Save draft / Submit — §8</text><rect x="336" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="396.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">RefCounter</text><line x1="396.0" y1="62" x2="396.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="468" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="528.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">Requests</text><line x1="528.0" y1="62" x2="528.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="600" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="660.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">RequestItems</text><line x1="660.0" y1="62" x2="660.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="732" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="792.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">RequestTimeline</text><line x1="792.0" y1="62" x2="792.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="32" cy="88" r="12" fill="#FCF1EA" stroke="#CA5010" stroke-width="1.6"/><text x="32" y="92.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#CA5010" font-weight="700" text-anchor="middle">1</text><text x="54" y="84.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Drop empty rows. Submit needs a line with</text><text x="54" y="98.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">quantity &gt; 0.</text><circle cx="32" cy="134" r="12" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.6"/><text x="32" y="138.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#605E5C" font-weight="700" text-anchor="middle">2</text><text x="54" y="130.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Recipes R1 + R2: the office’s chain and</text><text x="54" y="144.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">the first holder.</text><circle cx="32" cy="180" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="184.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">3</text><text x="54" y="176.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Create this month’s counter row if it is</text><text x="54" y="190.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">missing.</text><line x1="318" y1="180" x2="350.0" y2="180" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="352.0" y="168" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="396.0" y="184.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">ensure</text><circle cx="32" cy="226" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="230.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">4</text><text x="54" y="222.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Attempt: bump the counter …</text><line x1="318" y1="226" x2="350.0" y2="226" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="352.0" y="214" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="396.0" y="230.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">LastSeq+1</text><circle cx="32" cy="272" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="276.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">5</text><text x="54" y="268.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">… and insert the header as SR-YYYYMM-NNNN.</text><text x="54" y="282.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">A clash on the unique Title: next attempt</text><text x="54" y="296.75" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">(5 in all).</text><line x1="318" y1="272" x2="482.0" y2="272" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="484.0" y="260" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="528.0" y="276.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">insert</text><circle cx="32" cy="331.2" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="335.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">6</text><text x="54" y="327.2" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Insert every line, numbered -01, -02 …</text><line x1="318" y1="331.2" x2="614.0" y2="331.2" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="616.0" y="319.2" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="660.0" y="335.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">insert all</text><circle cx="32" cy="377.2" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="381.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">7</text><text x="54" y="373.2" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">&quot;Request submitted&quot; (or &quot;Draft created&quot;).</text><line x1="318" y1="377.2" x2="746.0" y2="377.2" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="748.0" y="365.2" width="88" height="24" rx="12" fill="#