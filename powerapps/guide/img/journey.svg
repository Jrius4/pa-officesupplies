<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8886"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><line x1="112" y1="80" x2="232" y2="80" stroke="#1CABE2" stroke-width="3"/><line x1="276" y1="80" x2="396" y2="80" stroke="#D2D0CE" stroke-width="3" stroke-dasharray="6 5"/><line x1="440" y1="80" x2="560" y2="80" stroke="#D2D0CE" stroke-width="3" stroke-dasharray="6 5"/><line x1="604" y1="80" x2="724" y2="80" stroke="#D2D0CE" stroke-width="3"/><line x1="768" y1="80" x2="888" y2="80" stroke="#D2D0CE" stroke-width="3"/><circle cx="90" cy="80" r="20" fill="#1CABE2" stroke="#1CABE2" stroke-width="2"/><text x="90" y="85" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">✓</text><text x="90" y="126" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#323130" font-weight="600" text-anchor="middle">Submitted</text><text x="90" y="146" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="middle">Requester</text><circle cx="254" cy="80" r="20" fill="#FFFFFF" stroke="#1CABE2" stroke-width="3"/><text x="254" y="85" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#0F86B5" font-weight="700" text-anchor="middle">●</text><text x="254" y="126" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#323130" font-weight="600" text-anchor="middle">Review</text><text x="254" y="146" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="middle">Reviewer</text><circle cx="418" cy="80" r="20" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="2" stroke-dasharray="4 3"/><text x="418" y="85" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#8A8886" font-weight="700" text-anchor="middle">–</text><text x="418" y="126" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8A8886" font-weight="600" text-anchor="middle" text-decoration="line-through">Approval</text><text x="418" y="146" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="middle" font-style="italic">skipped: no matrix row</text><circle cx="582" cy="80" r="20" fill="#FFFFFF" stroke="#D2D0CE" stroke-width="2"/><text x="582" y="85" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8A8886" font-weight="600" text-anchor="middle">4</text><text x="582" y="126" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8A8886" font-weight="600" text-anchor="middle">Confirm</text><text x="582" y="146" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="middle">Chief Field Office</text><circle cx="746" cy="80" r="20" fill="#FFFFFF" stroke="#D2D0CE" stroke-width="2"/><text x="746" y="85" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8A8886" font-weight="600" text-anchor="middle">5</text><text x="746" y="126" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8A8886" font-weight="600" text-anchor="middle">Deliver</text><text x="746" y="146" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="middle">Storekeeper</text><circle cx="910" cy="80" r="20" fill="#FFFFFF" stroke="#D2D0CE" stroke-width="2"/><text x="910" y="85" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8A8886" font-weight="600" text-anchor="middle">6</text><text x="910" y="126" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#8A8886" font-weight="600" text-anchor="middle">Receive &amp; close</text><text x="910" y="146" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="middle">Requester</text><text x="30" y="30" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#605E5C" font-weight="400" text-anchor="start">Every request: six legs, five stage codes. A stage with no active ApprovalMatrix row is skipped.</text><rect x="220" y="190" width="360" height="54" rx="6" fill="#FCF1EA" stroke="#CA5010" stroke-width="1.2"/><text x="236" y="212" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#CA5010" font-weight="600" text-anchor="start">Return (Review, Approval or Confirm)</text><text x="236" y="232" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">goes back to the requester as Returned; they edit and resubmit</text><path d="M 254 150 L 254 190" fill="none" stroke="#CA5010" stroke-width="1.6" marker-end="url(#arr)"/><rect x="600" y="190" width="230" height="54" rx="6" fill="#FAEEEF" stroke="#A4262C" stroke-width="1.2"/><text x="616" y="212" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#A4262C" font-weight="600" text-anchor="start">Reject</text><text x="616" y="232" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">ends the request as Rejected</text><path d="M 582 150 L 582 190" fill="none" stroke="#A4262C" stroke-width="1.6" marker-end="url(#arr)"/><rect x="640" y="262" width="330" height="54" rx="6" fill="#F5F0FA" stroke="#8764B8" stroke-width="1.2"/><text x="656" y="284" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#8764B8" font-weight="600" text-anchor="start">Partial delivery</text><text x="656" y="304" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">stays at Deliver until everything approved is out</text><path d="M 746 150 L 746 262" fill="none" stroke="#8764B8" stroke-width="1.6" marker-end="url(#arr)"/><text x="30" y="300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">Status ranks: Draft 10 · Returned 15 · Submitted 20 · Reviewed 30 · Partial 40</text><text x="30" y="318" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#605E5C" font-weight="400" text-anchor="start">Fully delivered 50 · Fully received 60 · Closed 70 · Rejected 90.   Open = rank below 70.</text></svg>