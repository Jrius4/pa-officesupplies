<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 551.2" width="1010" height="551.2"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8886"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="28" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#323130" font-weight="700" text-anchor="start">Record distribution — §12, for each line</text><rect x="336" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="396.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">Catalogue</text><line x1="396.0" y1="62" x2="396.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="468" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="528.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">StockLedger</text><line x1="528.0" y1="62" x2="528.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="600" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="660.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">RequestItems</text><line x1="660.0" y1="62" x2="660.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="732" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="792.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">Requests</text><line x1="792.0" y1="62" x2="792.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="864" y="40" width="120" height="22" rx="4" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="924.0" y="56" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="600" text-anchor="middle">RequestTimeline</text><line x1="924.0" y1="62" x2="924.0" y2="491.2" stroke="#EDEBE9" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="32" cy="88" r="12" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.6"/><text x="32" y="92.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#605E5C" font-weight="700" text-anchor="middle">1</text><text x="54" y="84.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Read the live stock of the office</text><text x="54" y="98.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">supplying the line.</text><line x1="318" y1="88" x2="350.0" y2="88" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="352.0" y="76" width="88" height="24" rx="12" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1.2"/><text x="396.0" y="92.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#605E5C" font-weight="700" text-anchor="middle">re-read</text><circle cx="32" cy="134" r="12" fill="#FCF1EA" stroke="#CA5010" stroke-width="1.6"/><text x="32" y="138.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#CA5010" font-weight="700" text-anchor="middle">2</text><text x="54" y="130.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Not enough now? Record the line as failed</text><text x="54" y="144.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">and go to the next one.</text><circle cx="32" cy="180" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="184.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">3</text><text x="54" y="176.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">The ledger row first: Distribution, −qty,</text><text x="54" y="190.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">BalanceAfter.</text><line x1="318" y1="180" x2="482.0" y2="180" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="484.0" y="168" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="528.0" y="184.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">add</text><circle cx="32" cy="226" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="230.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">4</text><text x="54" y="222.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Then the new StockQty and RowVersion + 1.</text><line x1="318" y1="226" x2="350.0" y2="226" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="352.0" y="214" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="396.0" y="230.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">patch</text><circle cx="32" cy="272" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="276.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">5</text><text x="54" y="268.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Then QtyDistributed and Fully / Partially</text><text x="54" y="282.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">distributed.</text><line x1="318" y1="272" x2="614.0" y2="272" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="616.0" y="260" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="660.0" y="276.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">patch</text><circle cx="32" cy="318" r="12" fill="#FCF1EA" stroke="#CA5010" stroke-width="1.6"/><text x="32" y="322.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#CA5010" font-weight="700" text-anchor="middle">6</text><text x="54" y="314.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">After every line: did at least one line</text><text x="54" y="328.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">move? If not, stop here.</text><circle cx="32" cy="364" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="368.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">7</text><text x="54" y="360.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Fully delivered (50) → Receive, to the</text><text x="54" y="374.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">requester; else Partial (40), stays at</text><text x="54" y="388.75" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Deliver.</text><line x1="318" y1="364" x2="746.0" y2="364" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="748.0" y="352" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="792.0" y="368.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">patch</text><circle cx="32" cy="423.2" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="427.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">8</text><text x="54" y="419.2" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">&quot;Items distributed&quot;: this step and the</text><text x="54" y="433.575" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">running total.</text><line x1="318" y1="423.2" x2="878.0" y2="423.2" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="880.0" y="411.2" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="924.0" y="427.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">add</text><circle cx="32" cy="469.2" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="473.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">9</text><text x="54" y="465.2" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">When fully delivered: &quot;Routed to Receive&quot;.</text><line x1="318" y1="469.2" x2="878.0" y2="469.2" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="880.0" y="457.2" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="924.0" y="473.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">add</text><text x="20" y="515.2" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#605E5C" font-weight="400" text-anchor="start">Failed lines are listed on screen and the screen reloads; lines that moved are already off the list.</text></svg>