ica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">The requester, holding it.</text><circle cx="32" cy="134" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="138.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">2</text><text x="54" y="130.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">QtyReceived, condition, Fully / Partially</text><text x="54" y="144.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">received, the note if not Complete.</text><line x1="318" y1="134" x2="350.0" y2="134" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="352.0" y="122" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="396.0" y="138.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">patch each</text><circle cx="32" cy="180" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="184.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">3</text><text x="54" y="176.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">Everything approved delivered: Closed</text><text x="54" y="190.375" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">(70), ClosedOn. Otherwise Fully received</text><text x="54" y="204.75" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">(60).</text><line x1="318" y1="180" x2="482.0" y2="180" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="484.0" y="168" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="528.0" y="184.5" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">patch</text><circle cx="32" cy="239.2" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="243.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">4</text><text x="54" y="235.2" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">&quot;Receipt confirmed&quot;: received of</text><text x="54" y="249.575" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">distributed, or the note.</text><line x1="318" y1="239.2" x2="614.0" y2="239.2" stroke="#D2D0CE" stroke-width="1.2" marker-end="url(#arr)"/><rect x="616.0" y="227.2" width="88" height="24" rx="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.2"/><text x="660.0" y="243.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">add</text><circle cx="32" cy="285.2" r="12" fill="#E6F6FC" stroke="#1CABE2" stroke-width="1.6"/><text x="32" y="289.7" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F86B5" font-weight="700" text-anchor="middle">5</text><text x="54" y="281.2" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#323130" font-weight="400" text-anchor="start">When closed: &quot;Request closed&quot;.</text><line x1="318" y1="285.2" x2="614.0" y2="285.2" stroke="#D2D0CE"