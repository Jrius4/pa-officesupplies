# ORACLE 02 — captured from Studio: Gallery1 -> ... -> View code.
# A default "Vertical gallery" (Insert > Popular > Vertical gallery), unmodified.
#
# NOTE ON COMPLETENESS: the Code dialog does not scroll with the mouse wheel and
# cannot be scripted (it lives in Studio's iframe), so this was read by dragging
# the scrollbar and screenshotting. Lines 34-40, 42-51 and 82-90 of the 96-line
# document were not read; they are the remainder of Title1/Subtitle1/Separator1
# property blocks. Every CONTROL TYPE and every structural key in the document is
# captured. Elisions are marked.

- Gallery1:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      BorderColor: =RGBA(0, 18, 107, 1)
      X: =100
      Y: =100
    Children:
      - Image1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =72
            OnSelect: =Select(Parent)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =72
            X: =16
            Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
      - Title1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.'Open Sans'
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            # ... lines 34-40 not read ...
      - Subtitle1:
          # Control: (Label@2.5.1 - not read, but Subtitle is a Label)
          Properties:
            # ... lines 43-51 not read ...
            PaddingTop: =0
            Size: =12
            Text: =ThisItem.SampleText
            VerticalAlign: =VerticalAlign.Top
            Width: =Title1.Width
            X: =Title1.X
            Y: =Title1.Y + Title1.Height
      - NextArrow1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(166, 166, 166, 1)
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            DisabledColor: =RGBA(119, 119, 119, 1)
            Height: =50
            Icon: =Icon.ChevronRight
            OnSelect: =Select(Parent)
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Tooltip: ="View item details"
            Width: =50
            X: =Parent.TemplateWidth - Self.Width - 12
            Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
      - Separator1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            # ... lines 82-90 not read ...
      - Rectangle2:
          Control: Rectangle@2.3.0     # selection bar
          Properties:
            Fill: =RGBA(0, 18, 107, 1)
            Height: =Parent.TemplateHeight - Separator1.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
